# dsh-gearbox bundle patch
#
# Installed through the official CLI:
#
#   dsh plugin --profile <name> add dsh-gearbox
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-gearbox` to the bundle stack. The
# profile boot then merges THIS patch exactly like a manual cordis.patch.yml
# mount line. No profile file edits needed — one command installs and mounts.
#
# Aggregate double-mount guard: an aggregate bundle may already mount this
# package under its own entry id. The `!!js` disabled expression backs THIS
# row off when another *enabled* entry already mounts `dsh-gearbox`.
- insert:
    - id: gearbox
      name: 'dsh-gearbox'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-gearbox' && e.options.id !== 'gearbox' && !e.disabled)"
